[package]
name = "ut-json-schema"
version = "0.1.0"
edition = "2021"
description = "JSON Schema validation tool compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ut-contract = { path = "../ut-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.59", default-features = false, features = ["idna"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"
